logger:
  file:
    path: /var/log/open5gs/upf.log
  level: info

upf:
  pfcp:
    server:
      - address: __PFCP_UPF_IP__
  gtpu:
    server:
      - address: __UPF_IP__
  session:
    - subnet: __UE_SUBNET__
      gateway: __UE_GW__
      dev: __TUN_DEV__
      dnn: internet
  metrics:
    server:
      - address: __UPF_IP__
        port: 9092
