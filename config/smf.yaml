logger:
  file:
    path: /var/log/open5gs/smf.log
  level: info

smf:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7781
    client:
      scp:
        - uri: http://127.0.0.1:7778
  pfcp:
    server:
      - address: __PFCP_CP_IP__
    client:
      upf:
        - address: __PFCP_UPF_IP__
  gtpc:
    server:
      - address: 0.0.0.0
  gtpu:
    server:
      - address: 0.0.0.0
  metrics:
    server:
      - address: 0.0.0.0
        port: 9091
  session:
    - subnet: __UE_SUBNET__
      gateway: __UE_GW__
  dns:
    - 8.8.8.8
    - 8.8.4.4
  mtu: 1400
  info:
    - s_nssai:
        - sst: 3
          sd: 198153
          dnn:
            - internet
