# ============================================================
# open5GS 5G SA Core — Docker Compose
# ============================================================
# Two containers: CP (all 10 NFs) + UPF
# Two networks:   macvlan (external) + bridge (internal PFCP)
#
# All values come from .env file generated by start.sh:
#   ./scripts/start.sh --id 1 --amf-ip <AMF_IP> --upf-ip <UPF_IP>
# ============================================================

services:

  # ── Control Plane (10 NFs in one container) ──────────────────
  cp:
    container_name: ${INSTANCE_NAME}-cp
    image: ${IMAGE_CP}
    volumes:
      - ${INST_CONFIG}/nrf.yaml:/etc/open5gs/nrf.yaml
      - ${INST_CONFIG}/scp.yaml:/etc/open5gs/scp.yaml
      - ${INST_CONFIG}/amf.yaml:/etc/open5gs/amf.yaml
      - ${INST_CONFIG}/smf.yaml:/etc/open5gs/smf.yaml
      - ${INST_CONFIG}/ausf.yaml:/etc/open5gs/ausf.yaml
      - ${INST_CONFIG}/udm.yaml:/etc/open5gs/udm.yaml
      - ${INST_CONFIG}/udr.yaml:/etc/open5gs/udr.yaml
      - ${INST_CONFIG}/pcf.yaml:/etc/open5gs/pcf.yaml
      - ${INST_CONFIG}/nssf.yaml:/etc/open5gs/nssf.yaml
      - ${INST_CONFIG}/bsf.yaml:/etc/open5gs/bsf.yaml
      - ${INST_DIR}/logs/cp:/var/log/open5gs
    environment:
      DB_URI: mongodb://${MONGO_IP}/${DB_NAME}
    networks:
      cn-net:
        ipv4_address: ${AMF_IP}
        aliases:
          - nrf.open5gs.org
          - scp.open5gs.org
          - amf.open5gs.org
          - smf.open5gs.org
          - ausf.open5gs.org
          - udm.open5gs.org
          - udr.open5gs.org
          - pcf.open5gs.org
          - nssf.open5gs.org
          - bsf.open5gs.org
      internal:
        ipv4_address: ${PFCP_CP_IP}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7777 && echo ok"]
      interval: 1s
      timeout: 1s
      start_period: 1s
      retries: 60
    extra_hosts:
      - "mongohost:${MONGO_IP}"

  # ── User Plane Function ─────────────────────────────────────
  upf:
    container_name: ${INSTANCE_NAME}-upf
    image: ${IMAGE_UPF}
    volumes:
      - ${INST_CONFIG}/upf.yaml:/etc/open5gs/upf.yaml
      - ${INST_DIR}/logs/upf:/var/log/open5gs
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - "/dev/net/tun"
    networks:
      cn-net:
        ipv4_address: ${UPF_IP}
        aliases:
          - upf.open5gs.org
      internal:
        ipv4_address: ${PFCP_UPF_IP}
    depends_on:
      cp:
        condition: service_started

# ── Networks ──────────────────────────────────────────────────
# cn-net:     macvlan on host NIC — real IPs for gNB (NGAP, GTP-U)
# internal:   private bridge — PFCP between SMF ↔ UPF (isolated)
networks:
  cn-net:
    external: true
    name: ${MACVLAN_NET}
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET}
