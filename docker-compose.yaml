# ============================================================
# open5GS 5G SA Core — Docker Compose
# ============================================================
# Single container: all 11 NFs (10 CP + UPF) in one image
# Host networking: CP_IP and UPF_IP added as secondary IPs
#
# All values come from .env file generated by start.sh:
#   ./scripts/start.sh --lm-ip <LM> --trx-ip <TRX> --cp-ip <CP> --upf-ip <UPF>
# ============================================================

services:

  # ── Complete 5G Core (10 CP NFs + UPF) ───────────────────────
  core:
    container_name: ${CONTAINER_NAME}
    image: ${IMAGE}
    network_mode: host
    entrypoint: ["/bin/bash", "/opt/start-all.sh"]
    volumes:
      - ${INST_CONFIG}/start-all.sh:/opt/start-all.sh:ro
      - ${INST_CONFIG}/nrf.yaml:/etc/open5gs/nrf.yaml
      - ${INST_CONFIG}/scp.yaml:/etc/open5gs/scp.yaml
      - ${INST_CONFIG}/amf.yaml:/etc/open5gs/amf.yaml
      - ${INST_CONFIG}/smf.yaml:/etc/open5gs/smf.yaml
      - ${INST_CONFIG}/ausf.yaml:/etc/open5gs/ausf.yaml
      - ${INST_CONFIG}/udm.yaml:/etc/open5gs/udm.yaml
      - ${INST_CONFIG}/udr.yaml:/etc/open5gs/udr.yaml
      - ${INST_CONFIG}/pcf.yaml:/etc/open5gs/pcf.yaml
      - ${INST_CONFIG}/nssf.yaml:/etc/open5gs/nssf.yaml
      - ${INST_CONFIG}/bsf.yaml:/etc/open5gs/bsf.yaml
      - ${INST_CONFIG}/upf.yaml:/etc/open5gs/upf.yaml
      - ${LOG_DIR}:/var/log/open5gs
    environment:
      DB_URI: mongodb://${MONGO_IP}/${DB_NAME}
      CP_IP: ${CP_IP}
      UPF_IP: ${UPF_IP}
      TUN_DEV: ${TUN_DEV}
      # AMF health server — bind to CP IP to avoid port conflicts
      AMF_TCP_BIND_ADDR: ${CP_IP}
      AMF_TCP_PORT: "50051"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - "/dev/net/tun"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/${CP_IP}/7777 && echo ok"]
      interval: 1s
      timeout: 1s
      start_period: 1s
      retries: 60
